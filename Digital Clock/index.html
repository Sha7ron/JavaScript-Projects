<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIGITAL CLOCK</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <div class="clock">
        <div class="main-time">
          <span class="digit" id="hour"></span>
          <span class="colon">:</span>
          <span class="digit" id="min"></span>
        </div>
        <div class="side-info">
          <span id="sec"></span>
          <span id="ampm"></span>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
